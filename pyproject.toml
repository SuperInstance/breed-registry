[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "breed-registry"
version = "0.1.0"
description = "The Breed Registry: model selection as breeding selection. Maps tasks to recommended base models."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [
    { name = "SuperInstance" },
]
keywords = ["ai", "models", "selection", "registry", "breeding"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[project.urls]
Homepage = "https://github.com/SuperInstance/breed-registry"
Repository = "https://github.com/SuperInstance/breed-registry"

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov",
]

[tool.hatch.build.targets.wheel]
packages = ["src/breed_registry"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]